services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/entrypoint &
        until wget -qO- http://localhost:3000/api/healthz >/dev/null 2>&1; do sleep 2; done
        su git -c "forgejo admin user create --config /data/gitea/conf/app.ini --admin --username admin --password 'ChangeMe123!' --email admin@example.com --must-change-password=true" || true
        wait
    volumes:
      - forgejo_data:/data
    ports:
      - 3000:3000
    depends_on:
      - db
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=forgejo
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__DOMAIN=localhost
      - FORGEJO__server__ROOT_URL=http://localhost:3000/
      - FORGEJO__server__DISABLE_SSH=true
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
    x-tinkr:
      cpu: 500
      memory: 768
      environment:
        - FORGEJO__database__HOST=<hostname:db-5432>:5432
        - FORGEJO__server__DOMAIN=<hostname:forgejo-3000>
        - FORGEJO__server__ROOT_URL=<url:forgejo-3000>/
      ports:
        forgejo-3000:
          port: 3000
          protocol: http
          public: true
          healthcheck:
            path: /api/healthz
            interval: 30
            timeout: 10
            retries: 3
            success_code: 200-399

  db:
    image: postgres:17
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=forgejo
      - POSTGRES_DB=forgejo
    expose:
      - 5432
    x-tinkr:
      cpu: 250
      memory: 384
      ports:
        db-5432:
          port: 5432
          protocol: tcp
          public: false

volumes:
  forgejo_data:
  db_data:
